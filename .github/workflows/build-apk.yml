name: Build Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          set +o pipefail
          yes | sdkmanager --licenses --channel=3
          set -o pipefail
          sdkmanager --channel=3 "platforms;android-37.0" "build-tools;37.0.0"

      - name: Create temporary debug signing key
        working-directory: SetAppFull
        run: |
          mkdir -p ../signing
          keytool -genkeypair -v \
            -keystore ../signing/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000 -noprompt

      - name: Build debug APK
        working-directory: SetAppFull
        env:
          SETAPPFULL_ROOT: ${{ github.workspace }}
        run: bash ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SetAppFull-ZUXOS-${{ github.sha }}
          path: build/app/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
